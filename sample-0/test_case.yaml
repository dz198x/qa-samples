Title: Проверка работоспособности generate_emails.py.
Target: Скрипт должен вывести в консоль 10 случайных email.

Steps:
  1:
    Action: Выполнить команду в консоли [py ./generate_emails.py].
    Result: Вывод в консоль 10 случайных email. Формат [1-8 символов]@[8 символов].[3 символа]. Используются цифры и латиница.
